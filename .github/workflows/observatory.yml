name: Agent Observatory
on:
  pull_request:
    paths: ['apps/observatory/**', 'packages/**', 'infra/observatory/**', 'package.json', 'bun.lock', 'tsconfig.json', 'eslint.config.mjs', 'e2e*.config.ts', '.github/workflows/observatory.yml']
  push:
    branches: [main]
    paths: ['apps/observatory/**', 'packages/**', 'infra/observatory/**', 'package.json', 'bun.lock', '.github/workflows/observatory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: '1'
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run observatory:check
      - run: bun run observatory:lint
      - run: bun run observatory:build
      - run: bun build packages/agentlog/src/cli.ts --compile --outfile "$RUNNER_TEMP/agentlog"
      - run: bun run observatory:build:storybook
      - run: bunx --no-install playwright install chromium --with-deps
      - run: bun run observatory:test:e2e
      - name: Retain synthetic component proof
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: observatory-component-proof
          path: .e2e/
          include-hidden-files: true
          retention-days: 14
