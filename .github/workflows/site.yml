name: astack site

on:
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "plugins/applification/**"
      - "evals/routing.md"
      - "examples/chatgpt-plugin/**"
      - "examples/e2e-proof/**"
      - ".astack/e2e-proof/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site against the skill
        run: node site/check.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate portable astack package and site
        run: bun install --frozen-lockfile && bun run check && bun test scripts
      - name: Build and prove both reference profiles
        working-directory: examples/chatgpt-plugin
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun install --frozen-lockfile && bun run build && bun run typecheck && bun test && bun run build:storybook
      - name: Validate built portable artifact
        run: bun scripts/check-plugins.ts examples/chatgpt-plugin/dist/plugin

  e2e-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: 1.4.0
      - name: Install pinned reference and browser
        working-directory: examples/e2e-proof
        run: bun install --frozen-lockfile && bunx --no-install playwright install chromium --with-deps
      - name: Verify report policy and real browser repro loop
        working-directory: examples/e2e-proof
        run: bun run typecheck && bun test src && bun run verify
      - name: Retain first failures and proof summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-reference-proof
          path: examples/e2e-proof/.e2e/
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, plugin, e2e-reference]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
