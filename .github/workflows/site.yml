name: astack site

on:
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - "plugins/applification/**"
      - "evals/routing.md"
      - "examples/chatgpt-plugin/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site against the skill
        run: node site/check.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate portable astack package and site
        run: bun install --frozen-lockfile && bun run check && bun test scripts
      - name: Build and prove both reference profiles
        working-directory: examples/chatgpt-plugin
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"
        run: bun install --frozen-lockfile && bun run build && bun run typecheck && bun test && bun run build:storybook
      - name: Validate built portable artifact
        run: bun scripts/check-plugins.ts examples/chatgpt-plugin/dist/plugin

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
