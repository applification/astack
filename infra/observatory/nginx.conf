server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://otis.tail12a0a0.ts.net:8451 wss://otis.tail12a0a0.ts.net:8451 https://otis.tail12a0a0.ts.net:8452; img-src 'self' data: https://raw.githubusercontent.com; frame-ancestors 'none'; base-uri 'self'" always;
  location = /index.html {
    etag off;
    if_modified_since off;
    expires -1;
  }
  location / { try_files $uri $uri/ /index.html; }
}
