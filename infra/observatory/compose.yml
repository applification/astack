name: astack-observatory
services:
  backend:
    image: ${CONVEX_IMAGE:?Set a pinned Convex image digest}
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    ports:
      - '127.0.0.1:3220:3210'
      - '127.0.0.1:3221:3211'
    volumes:
      - observatory-data:/convex/data
    environment:
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:?}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:?}
      INSTANCE_NAME: astack-observatory
      INSTANCE_SECRET: ${INSTANCE_SECRET:?}
      DISABLE_BEACON: 'true'
      DISABLE_METRICS_ENDPOINT: 'true'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3210/version']
      interval: 5s
      start_period: 15s
  web:
    image: ${WEB_IMAGE:?Set a pinned nginx image digest}
    restart: unless-stopped
    ports:
      - '127.0.0.1:4180:80'
    volumes:
      - ../../apps/observatory/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard@sha256:f85cf0d0448b9c835ae3df5c7c1c6f0145dd4c8f0f92eb0245daf304efdd9f1a
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 10s
    ports:
      - '127.0.0.1:6792:6791'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN:?}
      NEXT_PUBLIC_LOAD_MONACO_INTERNALLY: 'true'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:6791/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
volumes:
  observatory-data:
