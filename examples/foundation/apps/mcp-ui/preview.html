<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>astack MCP App preview</title>
  </head>
  <body style="margin: 24px">
    <h1>MCP App preview</h1>
    <p id="status" role="status">
      Connect with WorkOS to load your work items from local Convex.
    </p>
    <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px">
      <button class="button button-primary" id="connect">
        Connect with WorkOS
      </button>
      <button class="button button-secondary" id="refresh" disabled>
        Refresh work items
      </button>
      <button class="button button-secondary" id="disconnect" disabled>
        Disconnect
      </button>
    </div>
    <div id="app-container" style="margin-top: 24px"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
