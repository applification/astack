<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px system-ui;color:var(--foreground)}p{line-height:1.5}button,select{font:inherit;border:1px solid var(--border);background:var(--card);color:inherit;border-radius:7px;padding:9px 12px;cursor:pointer}button:hover{background:var(--muted)}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar strong{margin-right:auto}.workspace{position:relative;height:380px;padding:16px;border-radius:12px;background:var(--card)}svg{width:100%;height:100%}svg circle{fill:var(--chart-2);stroke:var(--foreground);stroke-width:2}svg text{fill:var(--foreground);font-size:12px;pointer-events:none}svg line{stroke:var(--muted-foreground);stroke-width:2}svg g,svg line{cursor:pointer}aside{position:absolute;right:12px;top:12px;bottom:12px;width:250px;padding:16px;background:var(--popover);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 40px #0002;overflow:auto;display:none}aside.open{display:block}aside h3{font-size:18px;margin:12px 0}aside p,.caption{color:var(--muted-foreground)}.close{float:right;padding:2px 7px}.filters{position:relative}.filter-panel{position:absolute;right:0;z-index:2;width:235px;padding:16px;border:1px solid var(--border);background:var(--popover);border-radius:10px;box-shadow:0 10px 40px #0002;display:none}.filter-panel.open{display:grid;gap:10px}.filter-panel label{display:flex;gap:8px}.dock{position:absolute;bottom:16px;left:16px;display:flex;gap:4px}.caption{font-size:12px;margin:12px 0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}@media(max-width:600px){aside.open{position:relative;width:auto;right:auto;top:auto;bottom:auto;margin-top:10px}.workspace{height:auto;min-height:360px}svg{height:300px}.dock{bottom:auto;top:320px}}
</style></head><body><p class="caption">Interaction direction · prototype of the surrounding UI. The captured graph model stays unchanged.</p><div class="toolbar"><strong>Captured network</strong><select aria-label="Layout"><option>Force layout</option><option>Communities</option><option>Layered</option></select><div class="filters"><button onclick="document.querySelector('.filter-panel').classList.toggle('open')">☷ Filters</button><div class="filter-panel"><strong>Relationships</strong><select><option>All captured links</option><option>Delegation</option><option>Results and declared use</option></select><strong>Include detail</strong><label><input type="checkbox" checked> Activity</label><label><input type="checkbox" checked> Skill references</label><label><input type="checkbox" checked> Evidence</label></div></div><button>Expand all</button><button>View ▾</button></div><div class="workspace"><svg viewBox="0 0 720 380"><line x1="125" y1="260" x2="340" y2="180" onclick="inspect('Delegated task','Relationship','Parent conversation → UI checks','The parent capture records a distinct delegated task. Completion and parent use are independent facts.')"><title>Select the captured delegation relationship</title></line><line x1="340" y1="180" x2="435" y2="75"/><g onclick="inspect('Parent conversation','Conversation','Expand the recorded turns and their activity.','Conversation identity and captured turn sources are available in the detail panel.')"><circle cx="125" cy="260" r="30"/><text x="65" y="312">Parent conversation</text></g><g onclick="inspect('UI checks','Delegated task','Task completed · host reported','Open captured child turns, result observations and declared-use evidence. Completion alone does not establish result receipt.')"><circle cx="340" cy="180" r="24"/><text x="305" y="222">UI checks</text><title>UI checks · task completed · select for supporting evidence</title></g><g onclick="inspect('UI checks · conversation','Conversation','Separate child conversation','Inspect its own captured turns and supporting references.')"><circle cx="435" cy="75" r="27"/><text x="358" y="30">Child conversation</text></g></svg><div class="dock"><button>+</button><button>−</button><button>Fit</button></div><aside><button class="close" onclick="document.querySelector('aside').classList.remove('open')" aria-label="Close inspection">×</button><span class="eyebrow" id="kind"></span><h3 id="title"></h3><p id="summary"></p><p id="support"></p><a href="#" onclick="return false">Open source trace ↗</a></aside></div><p class="caption">Hover / focus for a short preview. Select a node or relationship for persistent evidence. Navigation stays attached to the canvas.</p><script>function inspect(title,kind,summary,support){document.querySelector('aside').classList.add('open');for(const [id,text] of Object.entries({title,kind,summary,support}))document.getElementById(id).textContent=text}inspect('UI checks','Delegated task','Task completed · host reported','Inspect captured child turns, result observations and declared-use evidence. These remain independent facts.');</script></body></html>
